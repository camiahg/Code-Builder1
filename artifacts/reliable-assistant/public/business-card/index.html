<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line makes the page fit phone screens. Leave it as is. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- EDIT: The text on the browser tab / link preview -->
  <title>Camiah Gillie | Your Reliable Assistant</title>

  <style>
    /* ---------- COLORS (edit here to change them everywhere) ---------- */
    :root {
      --green: #344f1f;        /* Dark green */
      --yellow: #e7b706;       /* Yellow */
      --page-bg: #eef2e8;      /* Soft green tint behind the card */
      --card-bg: #ffffff;      /* White card */
      --text: #2b2b2b;         /* Body text */
    }

    /* ---------- PAGE SETUP ---------- */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;       /* centers the card up and down */
      justify-content: center;   /* centers the card left and right */
      padding: 24px 16px;
      background: var(--page-bg);
      color: var(--text);
      /* One clean sans-serif font. These are already on every device, so nothing to download. */
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      line-height: 1.5;
    }

    /* ---------- THE CARD ---------- */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 20px;
      border-top: 8px solid var(--yellow);   /* yellow accent bar */
      box-shadow: 0 10px 30px rgba(52, 79, 31, 0.15);
      padding: 40px 18px 44px;
      text-align: center;
    }

    /* Spacing between each section */
    .card > * + * { margin-top: 28px; }

    /* ---------- PROFILE PHOTO ---------- */
    .photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;        /* makes it a circle */
      object-fit: cover;         /* crops to fill the circle without stretching */
      display: block;
      margin-left: auto;
      margin-right: auto;
      border: 4px solid var(--yellow);
    }


    /* ---------- NAME, BUSINESS, TAGLINE ---------- */
    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;          /* bolder than the body text */
      color: var(--green);
      line-height: 1.2;
    }

    h2 {
      margin: 6px 0 0;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--green);
    }

    .tagline {
      margin: 14px 0 0;
      font-size: 0.95rem;
      color: #5a5a5a;
    }

    /* ---------- LOGO ---------- */
    .logo {
      width: 120px;              /* EDIT: change this number to make the logo bigger or smaller */
      max-width: 100%;
      height: auto;              /* keeps the right shape, no stretching */
      display: block;
      margin-left: auto;
      margin-right: auto;
    }


    /* ---------- QR CODE ---------- */
    .qr-code {
      width: 150px;              /* EDIT: change this number to make the QR code bigger or smaller */
      height: 150px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .qr-caption {
      margin: 10px 0 0;
      font-size: 0.85rem;
      color: #5a5a5a;
    }

    /* ---------- CONTACT LINKS ---------- */
    .contact a {
      display: block;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--green);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      word-break: break-word;    /* stops the long email from overflowing */
    }

    .contact a + a { margin-top: 12px; }

    /* The email is long, so its text is a little smaller to keep it on one line on phones */
    .contact a[href^="mailto"] { font-size: clamp(0.7rem, 3.3vw, 0.9rem); padding-left: 8px; padding-right: 8px; }

    .contact a:hover,
    .contact a:focus {
      background: var(--yellow);
      color: var(--green);
    }

    /* ---------- BIGGER SCREENS ---------- */
    @media (min-width: 600px) {
      .card { padding: 48px 28px 52px; }
      h1 { font-size: 2.3rem; }
    }
  </style>
</head>
<body>
